<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo Design Studio - PrintPro Redirect</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #dc6f2a, #bf5214);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            text-align: center;
            color: white;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px;
        }
        p {
            font-size: 1.1rem;
            margin: 0 0 30px;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #dc6f2a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Leo Design Studio</h1>
        <p>Redirecting to PrintPro...</p>
        <a href="https://leodesignstudio.com" class="btn">Go to Website</a>
    </div>
    <script>
        // Auto-redirect after 2 seconds
        setTimeout(() => {
            window.location.href = 'https://leodesignstudio.com';
        }, 2000);
    </script>
</body>
</html>
